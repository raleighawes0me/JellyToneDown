name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Do not remove these two steps as "redundant" because JPRM builds anyway. JPRM's
      # first action is `dotnet clean`, which needs the project to have been restored
      # already; without a restore first, packaging fails before it builds anything.
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Package with JPRM
        uses: oddstr13/jellyfin-plugin-repository-manager@v1.1.1
        id: jprm
        with:
          dotnet-target: net10.0

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: jellytonedown
          retention-days: 30
          if-no-files-found: error
          path: ${{ steps.jprm.outputs.artifact }}

  web-tests:
    name: Browser script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No setup-node step on purpose. The runner image already ships Node, and any version
      # it ships runs this suite, so there is one fewer action major to keep current.
      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund

      - name: Run the browser script tests
        working-directory: tests
        run: npm test
