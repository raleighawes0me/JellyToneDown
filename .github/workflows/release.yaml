name: Release

# Cut a release by tagging a commit on main:
#     git tag v1.0.1 && git push origin v1.0.1
#
# Or run this workflow by hand from the Actions tab and type the version.
#
# It builds the plugin, attaches the zip to a GitHub release, and adds the version to
# manifest.json on main, so servers that have added this repository as a Jellyfin plugin
# repository are offered the update.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Builds from main rather than the tag, because the last step pushes the
          # manifest commit back to main. Tag main's HEAD when you release.
          ref: main
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME#v}"
          fi
          # Jellyfin wants a four-part version string.
          FOUR="$RAW"
          while [ "$(echo "$FOUR" | tr -cd '.' | wc -c)" -lt 3 ]; do FOUR="$FOUR.0"; done
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "four=$FOUR" >> "$GITHUB_OUTPUT"
          echo "tag=v$RAW" >> "$GITHUB_OUTPUT"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Stamp the version
        run: |
          python - <<'PY'
          import os, re, pathlib
          four = os.environ['FOUR']
          p = pathlib.Path('build.yaml')
          p.write_text(re.sub(r'^version:.*$', f'version: "{four}"', p.read_text(), flags=re.M))
          d = pathlib.Path('Directory.Build.props')
          t = d.read_text()
          for tag in ('Version', 'AssemblyVersion', 'FileVersion'):
              t = re.sub(rf'<{tag}>[^<]*</{tag}>', f'<{tag}>{four}</{tag}>', t)
          d.write_text(t)
          PY
        env:
          FOUR: ${{ steps.version.outputs.four }}

      # Do not remove these two steps. JPRM's first action is `dotnet clean`, which needs
      # the project to have been restored already, so running it against a fresh checkout
      # fails before it builds anything. Restoring here is exactly what the Build workflow
      # does, and is the reason that one is green.
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Uses the same action as the Build workflow rather than calling the JPRM CLI by
      # hand; among other things it creates the output directory, which JPRM itself does
      # not do.
      - name: Package with JPRM
        uses: oddstr13/jellyfin-plugin-repository-manager@v1.1.1
        id: jprm
        with:
          dotnet-target: net10.0
          version: ${{ steps.version.outputs.four }}

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.jprm.outputs.artifact }}

      - name: Update manifest.json
        run: |
          ZIP="${{ steps.jprm.outputs.artifact }}"
          python tools/update_manifest.py \
            --manifest manifest.json \
            --build-yaml build.yaml \
            --zip "$ZIP" \
            --version "${{ steps.version.outputs.four }}" \
            --source-url "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/$(basename "$ZIP")"

      - name: Commit the manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Only manifest.json is committed. The version stamping above, and JPRM's own
          # edits to Directory.Build.props, are build-time only and deliberately discarded.
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json unchanged"
          else
            git commit -m "Add ${{ steps.version.outputs.four }} to the plugin manifest"
            git push origin HEAD:main
          fi
