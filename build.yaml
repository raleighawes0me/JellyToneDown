overview: "Adjust the volume of theme music. Just that."
description: >
  Jellyfin plays a theme song in the background when you open a series or a movie,
  and offers no way to turn it down. JellyToneDown adds one.

  A server-wide default plus optional per-user levels, applied to theme songs and the
  audio of theme videos and to nothing else. The adjustment is made on the server, so it
  reaches every client - the web player, Swiftfin, Findroid, the Android TV app, Kodi and
  Infuse alike - rather than only the ones that happen to expose a volume control. Files
  in your library are never modified; adjusted copies live in Jellyfin's cache.

  The plugin does not download, assign, rename or otherwise manage theme music. It only
  changes how loud it is.
artifacts:
